<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'Courier New', Courier, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="0.55" stop-color="#070d1a"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0a1122"/>
    </linearGradient>
    <linearGradient id="topface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#0c1c30"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floorclip">
      <polygon points="480,260 820,430 480,600 140,430"/>
    </clipPath>
  </defs>

  <rect width="960" height="620" rx="18" fill="url(#bg)"/>
  <ellipse cx="480" cy="300" rx="470" ry="240" fill="url(#halo)"/>

  <!-- isometric floor grid -->
  <g clip-path="url(#floorclip)" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1">
    <line x1="140" y1="430" x2="820" y2="430"/>
    <line x1="205" y1="395" x2="885" y2="395"/>
    <line x1="205" y1="465" x2="885" y2="465"/>
    <line x1="270" y1="360" x2="820" y2="360"/>
    <line x1="270" y1="500" x2="820" y2="500"/>
    <line x1="335" y1="325" x2="960" y2="325"/>
    <line x1="335" y1="535" x2="960" y2="535"/>
    <line x1="140" y1="430" x2="480" y2="260"/>
    <line x1="140" y1="430" x2="480" y2="600"/>
    <line x1="480" y1="260" x2="820" y2="430"/>
    <line x1="480" y1="600" x2="820" y2="430"/>
    <line x1="240" y1="360" x2="580" y2="190"/>
    <line x1="240" y1="360" x2="580" y2="530"/>
    <line x1="720" y1="360" x2="380" y2="190"/>
    <line x1="720" y1="360" x2="380" y2="530"/>
  </g>
  <polygon points="480,260 820,430 480,600 140,430" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2" filter="url(#glow)"/>

  <!-- shadow pool under the whole stack -->
  <ellipse cx="480" cy="520" rx="270" ry="52" fill="#000" opacity="0.55"/>

  <!-- ─── floating layer slabs (VFS · ENGINE · AI) ─── -->
  <!-- slab: COMMAND ENGINE (cyan) -->
  <g>
    <polygon points="380,402 590,395 800,402 590,409" fill="#0a2a3a"/>
    <polygon points="380,402 590,409 590,431 380,424" fill="#06202e"/>
    <polygon points="800,402 590,409 590,431 800,424" fill="#041824"/>
    <polygon points="590,388 800,395 590,402 380,395" fill="url(#topface)" stroke="#22d3ee" stroke-width="1.6" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <text x="590" y="399" text-anchor="middle" font-size="15" fill="#67e8f9" letter-spacing="2">COMMAND ENGINE · 119 cmds</text>
  </g>

  <!-- slab: PERSISTENT VFS (green) -->
  <g>
    <polygon points="445,458 655,465 865,458 655,451" fill="#0a3a2a"/>
    <polygon points="445,458 655,451 655,473 445,480" fill="#062e20"/>
    <polygon points="865,458 655,451 655,473 865,480" fill="#042418"/>
    <polygon points="655,444 865,451 655,458 445,451" fill="url(#topface)" stroke="#4ade80" stroke-width="1.6" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3.6s" repeatCount="indefinite"/>
    </polygon>
    <text x="655" y="448" text-anchor="middle" font-size="15" fill="#86efac" letter-spacing="2">PERSISTENT VFS · localStorage</text>
  </g>

  <!-- slab: AI OMNIROUTE (purple) -->
  <g>
    <polygon points="360,522 585,530 810,522 585,514" fill="#2a1a4a"/>
    <polygon points="360,522 585,514 585,538 360,546" fill="#20143a"/>
    <polygon points="810,522 585,514 585,538 810,546" fill="#170e2c"/>
    <polygon points="585,507 810,515 585,523 360,515" fill="url(#topface)" stroke="#a78bfa" stroke-width="1.6" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="4.2s" repeatCount="indefinite"/>
    </polygon>
    <text x="585" y="511" text-anchor="middle" font-size="15" fill="#c4b5fd" letter-spacing="2">AI · OMNIROUTE GATEWAY</text>
  </g>

  <!-- connector beams between terminal and slabs -->
  <g stroke-width="2.5" stroke-dasharray="7 9" fill="none">
    <line x1="480" y1="336" x2="480" y2="386" stroke="#22d3ee" stroke-opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="336" x2="660" y2="440" stroke="#4ade80" stroke-opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="330" y1="336" x2="452" y2="505" stroke="#a78bfa" stroke-opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ─── floating 3D terminal window ─── -->
  <g>
    <!-- extruded body: top + right faces -->
    <polygon points="240,90 266,64 746,64 720,90" fill="#1c2c4a"/>
    <polygon points="720,90 746,64 746,282 720,308" fill="#0a1426"/>
    <!-- chunky bottom lip -->
    <polygon points="240,322 720,322 746,296 746,308 720,334 240,334" fill="#060c18"/>
    <rect x="240" y="306" width="480" height="16" fill="#0d1830"/>
    <polygon points="720,306 746,280 746,296 720,322" fill="#050a14"/>
    <!-- drop shadow -->
    <rect x="258" y="112" width="480" height="240" rx="12" fill="#02050b" opacity="0.8"/>
    <!-- front glass face -->
    <rect x="240" y="90" width="480" height="240" rx="12" fill="url(#glass)" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="240" y="90" width="480" height="26" rx="12" fill="#0b1322"/>
    <rect x="240" y="104" width="480" height="12" fill="#0b1322"/>
    <circle cx="264" cy="103" r="6" fill="#ff5f56"/>
    <circle cx="284" cy="103" r="6" fill="#ffbd2e"/>
    <circle cx="304" cy="103" r="6" fill="#27c93f"/>
    <text x="480" y="108" text-anchor="middle" font-size="13" fill="#64748b">mayank@quanta: ~ — quanta OS 0.5.0</text>

    <!-- terminal content -->
    <text x="264" y="152" font-size="15" fill="#e2e8f0"><tspan fill="#4ade80">mayank@quanta:~$</tspan> ai stack the layers in 3d</text>
    <rect x="264" y="166" width="432" height="80" rx="10" fill="#061019" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="282" y="190" font-size="12" fill="#38bdf8">▚ quanta-ai · 0.4s · routed: omniroute</text>
    <text x="282" y="212" font-size="14" fill="#a5f3fc">terminal → engine → vfs → ai : 4 planes</text>
    <text x="282" y="232" font-size="14" fill="#c4b5fd">projection: isometric · glow: maximum</text>
    <text x="264" y="272" font-size="15" fill="#e2e8f0"><tspan fill="#4ade80">mayank@quanta:~$</tspan> theme matrix</text>
    <text x="264" y="300" font-size="15" fill="#e2e8f0"><tspan fill="#4ade80">mayank@quanta:~$</tspan> <tspan fill="#4ade80">█<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- ─── floating isometric cubes ─── -->
  <g>
    <g transform="translate(150,200)">
      <animateTransform attributeName="transform" type="translate" values="150 200;150 184;150 200" dur="4s" repeatCount="indefinite"/>
      <polygon points="0,-14 24,0 0,14 -24,0" fill="#22d3ee" opacity="0.9"/>
      <polygon points="-24,0 0,14 0,32 -24,18" fill="#0e7490"/>
      <polygon points="24,0 0,14 0,32 24,18" fill="#155e75"/>
    </g>
    <g transform="translate(830,170)">
      <animateTransform attributeName="transform" type="translate" values="830 170;830 186;830 170" dur="5s" repeatCount="indefinite"/>
      <polygon points="0,-14 24,0 0,14 -24,0" fill="#4ade80" opacity="0.9"/>
      <polygon points="-24,0 0,14 0,32 -24,18" fill="#15803d"/>
      <polygon points="24,0 0,14 0,32 24,18" fill="#166534"/>
    </g>
    <g transform="translate(858,395)">
      <animateTransform attributeName="transform" type="translate" values="858 395;858 379;858 395" dur="4.6s" repeatCount="indefinite"/>
      <polygon points="0,-14 24,0 0,14 -24,0" fill="#a78bfa" opacity="0.9"/>
      <polygon points="-24,0 0,14 0,32 -24,18" fill="#6d28d9"/>
      <polygon points="24,0 0,14 0,32 24,18" fill="#5b21b6"/>
    </g>
    <g transform="translate(112,430)">
      <animateTransform attributeName="transform" type="translate" values="112 430;112 446;112 430" dur="5.4s" repeatCount="indefinite"/>
      <polygon points="0,-14 24,0 0,14 -24,0" fill="#fbbf24" opacity="0.9"/>
      <polygon points="-24,0 0,14 0,32 -24,18" fill="#b45309"/>
      <polygon points="24,0 0,14 0,32 24,18" fill="#92400e"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#e0f2fe">
    <circle cx="220" cy="120" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="240" r="2"><animate attributeName="opacity" values="1;0;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="90" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="540" r="2"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="936" y="596" text-anchor="end" font-size="12" fill="#475569" letter-spacing="2">▲ ISOMETRIC RENDER · QUANTA OS</text>
</svg>
