    <text x="600" y="188" font-size="11" fill="#3e7d96" letter-spacing="1">React + TTY engine · pipes · aliases</text>
    <!-- terminal + cmd blocks -->
    <g>
      <polygon points="386,150 416,163 386,176 356,163" fill="#0e3247" stroke="#22d3ee" stroke-width="1"/>
      <polygon points="356,163 386,176 386,188 356,175" fill="#092434"/>
      <polygon points="416,163 386,176 386,188 416,175" fill="#061a26"/>
      <text x="386" y="202" text-anchor="middle" font-size="11" fill="#67e8f9">tty engine</text>
    </g>
    <g>
      <polygon points="560,150 590,163 560,176 530,163" fill="#0e3247" stroke="#22d3ee" stroke-width="1"/>
      <polygon points="530,163 560,176 560,188 530,175" fill="#092434"/>
      <polygon points="590,163 560,176 560,188 590,175" fill="#061a26"/>
      <text x="560" y="202" text-anchor="middle" font-size="11" fill="#67e8f9">119 cmds</text>
    </g>
    <g>
      <polygon points="470,168 500,181 470,194 440,181" fill="#0e3247" stroke="#22d3ee" stroke-width="1"/>
      <polygon points="440,181 470,194 470,206 440,193" fill="#092434"/>
      <polygon points="500,181 470,194 470,206 500,193" fill="#061a26"/>
      <text x="470" y="220" text-anchor="middle" font-size="11" fill="#67e8f9">pipes · ai</text>
    </g>
    <!-- localStorage cylinder -->
    <g>
      <rect x="612" y="188" width="44" height="26" fill="#0b2b40" stroke="#38bdf8"/>
      <ellipse cx="634" cy="188" rx="22" ry="8" fill="#123c5c" stroke="#38bdf8"/>
      <ellipse cx="634" cy="214" rx="22" ry="8" fill="none" stroke="#38bdf8" stroke-opacity="0.7"/>
      <text x="634" y="240" text-anchor="middle" font-size="11" fill="#7dd3fc">VFS·ls</text>
    </g>
  </g>

  <!-- ═══ animated data beams through the stack ═══ -->
  <g>
    <line x1="480" y1="60" x2="480" y2="600" stroke="url(#flow)" stroke-width="3" stroke-dasharray="8 10" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="380" y1="120" x2="380" y2="560" stroke="url(#flow)" stroke-width="2" stroke-dasharray="6 12" opacity="0.35">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="585" y1="120" x2="585" y2="560" stroke="url(#flow)" stroke-width="2" stroke-dasharray="6 12" opacity="0.35">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.9s" repeatCount="indefinite"/>
    </line>
    <!-- traveling pulses -->
    <circle r="5" fill="#22d3ee" filter="url(#aglow)">
      <animateMotion path="M480,55 L480,605" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#4ade80" filter="url(#aglow)">
      <animateMotion path="M380,115 L380,565" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#a78bfa" filter="url(#aglow)">
      <animateMotion path="M585,115 L585,565" dur="3.3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.3s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- flow annotations -->
  <g font-size="11" fill="#94a3b8">
    <text x="492" y="286">prompts ↓</text>
    <text x="492" y="466">routed calls ↓</text>
    <text x="612" y="86" fill="#38bdf8">real fetches · honest telemetry</text>
  </g>
</svg>
